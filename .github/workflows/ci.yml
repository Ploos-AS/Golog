name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Dependencies
        run: |
          go mod tidy
          echo '--- GO.SUM BEGIN ---'
          cat go.sum
          echo '--- GO.SUM END ---'

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/golog
